name: prose-lint
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          files: mkdocs-docs
          reporter: github-pr-check
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}